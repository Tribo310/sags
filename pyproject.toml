[project]
name = "shop-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "a2a-sdk[http-server]>=1.1",
  "fastapi>=0.141",
  "httpx>=0.28",
  "mcp>=2.2",
  "openai>=3.20",
  "pymongo>=4.18",
  "python-multipart>=0.0.20",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
